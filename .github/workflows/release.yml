name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: CleverCove v__VERSION__
          releaseBody: |
            Download the installer for your computer from the Assets section below.

            - macOS: choose the aarch64 DMG for Apple Silicon or the x64 DMG for Intel.
            - Windows: choose the setup EXE or MSI.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
      - name: Verify macOS app and disk image
        if: startsWith(matrix.target, 'aarch64-apple-') || startsWith(matrix.target, 'x86_64-apple-')
        shell: bash
        run: |
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          codesign --verify --deep --strict "$bundle_dir/macos/CleverCove.app"
          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          hdiutil verify "$dmg_path"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - run: gh release upload "${{ steps.version.outputs.tag }}" scripts/install.sh scripts/install.ps1 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify every supported installer exists
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --json assets --jq '.assets[].name' > release-assets.txt
          ./scripts/verify-release-assets.sh release-assets.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish as the latest stable release
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --prerelease=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
