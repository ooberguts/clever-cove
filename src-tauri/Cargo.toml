[package]
name = "clever-cove"
version = "0.1.1"
description = "A private, local-first educational practice app"
authors = ["CleverCove contributors"]
edition = "2021"

[lib]
name = "clever_cove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
